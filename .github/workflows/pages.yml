name: Test and publish Cork

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - assets/README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js && node --check board-core.js && node --check image-store.js && node --check export-core.js && node --check export-pdf.js
      - name: Test board behavior
        run: npm test
      - name: Prepare static files
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
